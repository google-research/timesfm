[project]
name = "timesfm"
version = "3.0.2"
description = "A time series foundation model."
authors = [
    {name = "Rajat Sen", email = "senrajat@google.com"},
    {name = "Yichen Zhou", email = "yichenzhou@google.com"},
    {name = "Abhimanyu Das", email = "abhidas@google.com"},
    {name = "Petros Mol", email = "pmol@google.com"},
    {name = "Ayush Jain", email="ayuj@google.com"},
    {name = "Michael Chertushkin", email = "chertushkinmichael@gmail.com"},
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "huggingface_hub>=0.28.0",
    "safetensors>=0.5.3",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
mlx = [
    "mlx>=0.32",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
]
# CPU-compatible (works on any machine)
flax = [
  "flax",
  "optax",
  "einshape",
  "orbax-checkpoint",
  "jaxtyping",
  "jax",
]
# GPU only (CUDA 12)
flax-cuda = [
  "flax",
  "optax",
  "einshape",
  "orbax-checkpoint",
  "jaxtyping",
  "jax[cuda12]",
]
# CPU-compatible
xreg = [
  "jax",
  "scikit-learn",
]
# GPU only (CUDA 12)
xreg-cuda = [
  "jax[cuda12]",
  "scikit-learn",
]

[tool.ruff]
line-length = 88
indent-width = 2

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
