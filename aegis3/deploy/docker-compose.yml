services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis3-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_DB: aegis3
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aegis3_pg:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis3-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  aegis3_pg: {}
