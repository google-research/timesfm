name: docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tool: [slither, foundry, echidna, medusa, mythril, halmos]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build ${{ matrix.tool }}
        uses: docker/build-push-action@v6
        with:
          context: workers/${{ matrix.tool }}
          push: false
          tags: aegis3/${{ matrix.tool }}:dev
